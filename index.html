<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192-v2.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d7377" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>נקודות דיקור</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!-- מסך פתיחה. הרקע זהה ל-background_color שבמניפסט, ולכן המעבר
         ממסך הטעינה של אנדרואיד אליו אינו נראה בכלל. -->
    <div id="splash" style="
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0d7377;
      transition: opacity 0.45s ease;
    ">
      <img src="/splash-mark.png" alt="נקודות דיקור" width="210" height="210"
           style="width: 210px; height: 210px; margin-bottom: 14px;" />
      <div style="font-family: Heebo, system-ui, sans-serif; font-size: 26px; font-weight: 800; color: #ffffff; line-height: 1;">
        נקודות דיקור
      </div>
      <div style="font-family: Heebo, system-ui, sans-serif; font-size: 13px; font-weight: 500; color: #bfe3e2; margin-top: 7px;">
        מאסטר דונג · שון גודמן
      </div>
    </div>
    <script>
      // 🚨 הזמן נספר מרגע שהאפליקציה מוכנה ולא מטעינת הדף. אנדרואיד
      // מציג מסך טעינה משלו שמכסה את הדף בזמן הטעינה, וספירה מטעינת
      // הדף נבלעת בתוכו - בדפדפן רואים את הזמן המלא ובטלפון כמעט כלום.
      const MIN_MS = 2200;
      const _hide = () => {
        const splash = document.getElementById("splash");
        if (!splash) return;
        splash.style.opacity = "0";
        setTimeout(() => splash.remove(), 450);
      };
      const _obs = new MutationObserver(() => {
        const root = document.getElementById("root");
        if (root && root.children.length > 0) {
          _obs.disconnect();
          // ⚠️ בלי requestAnimationFrame כאן. בלשונית שאינה גלויה הדפדפן
          // אינו מריץ פריימים, ואז המסך לא היה נעלם לעולם.
          setTimeout(_hide, MIN_MS);
        }
      });
      _obs.observe(document.getElementById("root"), { childList: true });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
